# Name:        build.yml
# Description: builds the game on clean machines with no ROM set (Linux with GCC, macOS with Clang,
#              Windows with MSVC), SDL2 inside the executables, and packs what a player runs: the
#              executables only, which load the player's assets pack, with their licenses; the Nintendo
#              Switch's .nsp pieces with devkitPro's toolchain and Android's game without a pack with the
#              NDK, both in every package beside the tools that make the player's .nsp and APK of them; a
#              tag v* makes a release of those packages
# Version:     0.5.0
# Created:     20-10-2026
# Modified:    25-10-2026
# Author:      Sebastian Toyos
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-universal
            os: macos-14
          - name: windows-x64
            os: windows-2022
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [switch, android]    # (their games go in the package, beside SegaSonic NSP and SegaSonic APK)
    steps:
      - uses: actions/checkout@v7

      # SDL2 is built from its source (SEGASONIC_STATIC_SDL2): on Linux it needs the headers of what it
      # talks to (it loads the libraries themselves when the game runs)
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libudev-dev libdbus-1-dev

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DSEGASONIC_REFERENCE_TOOLS=OFF -DSEGASONIC_STATIC_SDL2=ON

      - name: Configure (macOS, Apple silicon and Intel)
        if: runner.os == 'macOS'
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DSEGASONIC_REFERENCE_TOOLS=OFF -DSEGASONIC_STATIC_SDL2=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build/cmake -DSEGASONIC_REFERENCE_TOOLS=OFF -DSEGASONIC_STATIC_SDL2=ON

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      # the Switch's and Android's games, which SegaSonic NSP and SegaSonic APK make the player's .nsp and
      # APK of: the folders switch and android beside them
      - uses: actions/download-artifact@v8
        with:
          name: segasonic-switch
          path: build/bin/switch

      - uses: actions/download-artifact@v8
        with:
          name: segasonic-android
          path: build/bin/android

      # what a player runs (no headless runs, no build leftovers), in an archive of our own: the artifacts'
      # zip loses the executables' permissions. With it, the terms the executables come with: the project's,
      # MAME's and ymfm's (BSD-3: the board's libraries follow their behavior and tables), SDL2's (zlib) and
      # Kenney's (CC0). The .apps are signed ad hoc (no certificate): macOS then offers to open them anyway,
      # where a bundle signed in part is "damaged"
      - name: Pack
        shell: bash
        run: |
          mkdir -p dist/segasonic/licenses
          for file in build/bin/*; do
            case "$(basename "$file")" in
              *headless*|*.pdb|*.ilk|*.exp|*.lib|*.a) ;;
              *) cp -R "$file" dist/segasonic/ ;;
            esac
          done
          cp LICENSE dist/segasonic/LICENSE.txt
          cp tools/reference/mame/LICENSE dist/segasonic/licenses/MAME.txt
          cp tools/reference/ymfm/LICENSE dist/segasonic/licenses/ymfm.txt
          cp build/cmake/_deps/sdl2-src/LICENSE.txt dist/segasonic/licenses/SDL2.txt
          cp ports/sdl2/font/License.txt dist/segasonic/licenses/Kenney-Fonts.txt
          if [ -f ports/sdl2/prompts/License.txt ]; then
            cp ports/sdl2/prompts/License.txt dist/segasonic/licenses/Kenney-Input-Prompts.txt
          fi
          if [ -f docs/package/README.txt ]; then
            cp docs/package/README.txt dist/segasonic/README.txt    # (what the package holds, for its player)
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            for app in dist/segasonic/*.app; do
              codesign --force --deep --sign - "$app"
              codesign --verify --deep --strict --verbose=2 "$app"
            done
          fi
          ls -la dist/segasonic dist/segasonic/licenses
          cd dist
          case "$RUNNER_OS" in
            Linux) tar czf segasonic-${{ matrix.name }}.tar.gz segasonic ;;
            macOS) ditto -c -k --keepParent segasonic segasonic-${{ matrix.name }}.zip ;;
            Windows) 7z a -tzip segasonic-${{ matrix.name }}.zip segasonic ;;
          esac
          cd ..
          tar czf dist/segasonic-${{ matrix.name }}-all.tar.gz -C build bin

      - uses: actions/upload-artifact@v7
        with:
          name: segasonic-${{ matrix.name }}
          path: |
            dist/segasonic-${{ matrix.name }}.*
            dist/segasonic-${{ matrix.name }}-all.tar.gz

  # The Nintendo Switch: SegaSonic.nro (the Homebrew Menu) and the .nsp's pieces (main, main.npdm,
  # control.nacp, icon.jpg, font.bmp), with devkitPro's toolchain in its own image
  switch:
    name: switch
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -S . -B build/switch -DCMAKE_BUILD_TYPE=Release -DSEGASONIC_REFERENCE_TOOLS=OFF

      - name: Build
        run: cmake --build build/switch --target SegaSonic_switch --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: segasonic-switch
          path: build/bin/switch/

  # Android: the game without an assets pack or a signature (build/bin/android/segasonic-base.apk), with
  # the NDK and the SDK's tools of the runner's Android SDK and its Java 17 (ports/android/android.cmake)
  android:
    name: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.1" > /dev/null

      - name: Configure
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cmake -S . -B build/android -G Ninja -DCMAKE_BUILD_TYPE=Release -DSEGASONIC_REFERENCE_TOOLS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24

      - name: Build
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cmake --build build/android --target segasonic_apk --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: segasonic-android
          path: build/bin/android/

  # A tag v*: the packages as a GitHub release, its notes from docs/releases/TAG.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: segasonic-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SegaSonic $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            dist/segasonic-windows-x64.zip dist/segasonic-linux-x64.tar.gz dist/segasonic-macos-universal.zip
