plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.segasonic.port'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.segasonic.port'
        // API 21 (Android 5.0) supports all 32-bit (armeabi-v7a, x86) and 64-bit (arm64-v8a, x86_64) devices
        minSdk 21
        targetSdk 35
        // Auto-increment versionCode on every CI build so APK updates install in-place without uninstalling!
        def ciRunNum = System.getenv('GITHUB_RUN_NUMBER')?.isInteger()
            ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 0
        versionCode(10300 + ciRunNum)
        versionName '1.3.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_PLATFORM=android-21',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                          '-DCMAKE_POLICY_DEFAULT_CMP0057=NEW'
            }
        }
    }

    signingConfigs {
        // Persistent project keystore ensures every build shares the exact same certificate
        // so Android updates install seamlessly on top without deleting app data or segasonic.assets!
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def ksPath = System.getenv('SEGASONIC_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('SEGASONIC_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('SEGASONIC_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('SEGASONIC_KEY_PASSWORD') ?: 'android'
            } else {
                storeFile rootProject.file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            // Bundle Kenney CC0 input_prompts.bmp directly from ports/sdl2/prompts without duplicating in Git
            assets.srcDirs = ['src/main/assets', '../../../sdl2/prompts']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    packaging {
        jniLibs {
            // Uncompressed 16 KB page-aligned .so packaging inside APK for instant mmap startup
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Zero third-party Java/Kotlin dependencies: pure Android SDK + SDL2 + NDK for a tiny, instant-starting APK!
}
